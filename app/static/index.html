<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>musicmod</title>
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #uploads { list-style: none; padding: 0; }
  #uploads li { padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; }
  #uploads li.selected { border-color: #555; background: #f5f5f5; }
  .status-pending, .status-processing { color: #946200; }
  .status-error { color: #b00020; }
  .status-done { color: #1a7f37; }
  .track { border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem; margin-bottom: 0.75rem; display: flex; gap: 0.5rem; }
  .track-main { flex: 1; min-width: 0; }
  .track-side { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .track-side button { font-size: 0.75rem; padding: 2px 6px; }
  .track-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; flex-wrap: wrap; }
  .track-controls .stem-label { width: 70px; font-weight: 600; text-transform: capitalize; }
  .track-time { font-variant-numeric: tabular-nums; color: #555; font-size: 0.85rem; min-width: 4.5em; }
  .status-box { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .status-box dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.75rem; margin: 0.5rem 0 0; }
  .status-box dt { font-weight: 600; }
  .status-box dd { margin: 0; }
  nav a { margin-right: 1rem; }
  .transcribe-box { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #eee; }
  .transcribe-box p { margin: 0 0 0.5rem; }

  /* Master transport: the seek bar sits in its own row, inset by exactly the
     same padding+border as .track's content box, so it lines up pixel-for-
     pixel with the waveforms/rolls beneath it. */
  .master-transport { margin-bottom: 0.75rem; }
  .master-buttons { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
  .master-buttons .time-readout { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 9em; }
  /* Left/right inset set from JS (alignMasterBar) to match the waveforms
     below exactly — the .track-side button column's width isn't a fixed
     number this CSS can hardcode. */
  .master-bar-row { height: 10px; background: #eee; border-radius: 5px; cursor: pointer; overflow: hidden; }
  .master-bar-fill { height: 100%; width: 0; background: #3c46be; }

  .roll { position: relative; height: 80px; margin-top: 4px; background: #fafaff; border: 1px solid #eee; border-radius: 4px; overflow-x: auto; overflow-y: hidden; }
  .roll-inner { position: relative; height: 100%; min-width: 100%; }
  .roll canvas { display: block; width: 100%; height: 100%; }
  .roll .playhead { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: #c0392b; pointer-events: none; }
  .caption { font-size: 0.8rem; color: #666; margin-top: 2px; }
  .caption.hint { color: #999; font-style: italic; }
  .caption.dirty { color: #946200; font-weight: 600; }
</style>
</head>
<body>
  <nav><a href="/">Player</a><a href="/archive">Archive</a></nav>
  <h1>musicmod — stem player</h1>

  <form id="upload-form">
    <input type="file" id="file-input" accept=".wav,.flac,.mp3,.ogg,.m4a" required>
    <button type="submit">Upload &amp; separate</button>
  </form>

  <h2>Uploads</h2>
  <ul id="uploads"></ul>

  <h2>Player</h2>
  <div id="player"></div>

  <script src="/static/format.js"></script>
  <script src="/static/audioengine.js"></script>
  <script src="/static/pianoroll.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
