<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>musicmod</title>
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  /* pointer-events: none so the actual 'drop' event still lands on whatever
     is underneath — this is a visual cue only, not the drop target. */
  .drop-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(60, 70, 190, 0.12); border: 4px dashed #3c46be; box-sizing: border-box;
    align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 600; color: #2a3080; pointer-events: none;
  }
  .drop-overlay.active { display: flex; }
  #video-extract-box button { margin-top: 0.5rem; }
  #uploads { list-style: none; padding: 0; }
  #uploads li { padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; }
  #uploads li.selected { border-color: #555; background: #f5f5f5; }
  .status-pending, .status-processing { color: #946200; }
  .status-error { color: #b00020; }
  .status-done { color: #1a7f37; }
  .track { border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem; margin-bottom: 0.75rem; display: flex; gap: 0.5rem; }
  .track-main { flex: 1; min-width: 0; }
  .track-side { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .track-side button { font-size: 0.75rem; padding: 2px 6px; }
  /* Save/Revert have nothing to do until something's actually been edited,
     and the zoom buttons stop doing anything once a roll hits either end of
     its zoom range — grey both out there instead of leaving them clickable
     but inert. Save/Revert additionally highlight once there IS an unsaved
     edit, so a dirty roll is obvious without reading its caption text. */
  .track-side button:disabled { opacity: 0.4; cursor: default; }
  .track-side button.highlight {
    background: #e3a21a; border-color: #b17f12; color: #1a1a1a; font-weight: 700;
  }
  .track-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; flex-wrap: wrap; }
  .track-controls .stem-label { width: 70px; font-weight: 600; text-transform: capitalize; }
  .track-time { font-variant-numeric: tabular-nums; color: #555; font-size: 0.85rem; min-width: 4.5em; }

  /* Mute/solo/synth: a clear on/off color, not just bold text, so the
     current state reads at a glance instead of needing a close look. */
  .track-controls button.toggle-btn {
    padding: 3px 10px; border: 1px solid #bbb; border-radius: 4px;
    background: #f4f4f4; color: #333; cursor: pointer; font-weight: 600; font-size: 0.85rem;
  }
  .track-controls button.toggle-btn:hover { background: #e9e9e9; }
  .track-controls button.mute-btn.active { background: #c0392b; border-color: #962d22; color: #fff; }
  .track-controls button.solo-btn.active { background: #e3a21a; border-color: #b17f12; color: #1a1a1a; }
  .track-controls button.synth-btn.active { background: #2f7dd1; border-color: #235fa0; color: #fff; }
  .status-box { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .status-box dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.75rem; margin: 0.5rem 0 0; }
  .status-box dt { font-weight: 600; }
  .status-box dd { margin: 0; }
  nav a { margin-right: 1rem; }
  .transcribe-box { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #eee; }
  .transcribe-box p { margin: 0 0 0.5rem; }

  /* Master transport: the seek bar sits in its own row, inset by exactly the
     same padding+border as .track's content box, so it lines up pixel-for-
     pixel with the waveforms/rolls beneath it. */
  .master-transport { margin-bottom: 0.75rem; }
  .master-buttons { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
  .master-buttons .time-readout { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 9em; }
  /* Same button, same spot, whether it says Play or Pause — only the label
     and this color change, so a click in the same place always does the
     right thing without having to look up which button is which. */
  #play-pause-all.is-playing { background: #2f7dd1; border-color: #235fa0; color: #fff; }
  /* Left/right inset set from JS (alignMasterBar) to match the waveforms
     below exactly — the .track-side button column's width isn't a fixed
     number this CSS can hardcode. */
  .master-bar-row { height: 10px; background: #eee; border-radius: 5px; cursor: pointer; overflow: hidden; }
  .master-bar-fill { height: 100%; width: 0; background: #3c46be; }

  /* Time ruler across the top + the scrollable note canvas below — a single
     column now, deliberately: the note-name sidebar used to reserve its own
     42px grid column to the left of the roll, which pushed the roll's
     time-zero 42px to the right of the waveform's/master bar's time-zero,
     so the piano-roll playhead never lined up with the ones above it. The
     ruler and viewport now both start flush at the track's left edge, same
     as the waveform, so all the playheads share one x-axis. */
  .roll-grid {
    position: relative;
    margin-top: 4px; background: #fafaff; border: 1px solid #eee; border-radius: 4px; overflow: hidden;
  }
  .roll-ruler-wrap { position: relative; height: 18px; overflow: hidden; background: #f3f3fb; border-bottom: 1px solid #e3e3f0; }
  .roll-ruler-wrap canvas { position: absolute; top: 0; left: 0; display: block; }
  .roll { position: relative; height: 80px; overflow: auto; }
  .roll-inner { position: relative; min-width: 100%; min-height: 100%; }
  .roll canvas { display: block; width: 100%; height: 100%; }
  .roll .playhead { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: #c0392b; pointer-events: none; z-index: 2; }

  /* The note-name column and ruler corner float ON TOP of the roll instead
     of taking layout space, so they don't shift the time axis — see above.
     pointer-events: none lets clicks pass straight through to the real note
     canvas underneath, so adding/editing notes near time zero still works. */
  .roll-corner {
    position: absolute; top: 0; left: 0; width: 42px; height: 18px;
    background: #f3f3fb; border-right: 1px solid #e3e3f0; border-bottom: 1px solid #e3e3f0;
    pointer-events: none; z-index: 3;
  }
  .roll-keys-wrap {
    position: absolute; top: 18px; left: 0; bottom: 0; width: 42px; overflow: hidden;
    background: rgba(243, 243, 251, 0.88); border-right: 1px solid #e3e3f0;
    pointer-events: none; z-index: 3;
  }
  .roll-keys-wrap canvas { position: absolute; top: 0; left: 0; display: block; }
  .caption { font-size: 0.8rem; color: #666; margin-top: 2px; }
  .caption.hint { color: #999; font-style: italic; }
  .caption.dirty { color: #946200; font-weight: 600; }
</style>
</head>
<body>
  <nav><a href="/">Player</a><a href="/archive">Archive</a><a href="/downloads">Downloads</a></nav>
  <h1>musicmod — stem player</h1>

  <form id="upload-form">
    <input type="file" id="file-input" accept="audio/*,video/*" required>
    <button type="submit">Upload &amp; separate</button>
    <span class="caption">…or drag a song (or a video — its audio gets extracted first) anywhere on this page.</span>
  </form>

  <h2>Uploads</h2>
  <ul id="uploads"></ul>

  <h2>Player</h2>
  <div id="player"></div>

  <div id="drop-overlay" class="drop-overlay">Drop to upload</div>

  <script src="/static/format.js"></script>
  <script src="/static/audioengine.js"></script>
  <script src="/static/pianoroll.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
