<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>musicmod</title>
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #uploads { list-style: none; padding: 0; }
  #uploads li { padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; }
  #uploads li.selected { border-color: #555; background: #f5f5f5; }
  .status-pending, .status-processing { color: #946200; }
  .status-error { color: #b00020; }
  .status-done { color: #1a7f37; }
  .track { border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem; margin-bottom: 0.75rem; }
  .track-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; }
  .track-controls span { width: 70px; font-weight: 600; text-transform: capitalize; }
</style>
</head>
<body>
  <h1>musicmod — stem player</h1>

  <form id="upload-form">
    <input type="file" id="file-input" accept=".wav,.flac,.mp3,.ogg,.m4a" required>
    <button type="submit">Upload &amp; separate</button>
  </form>

  <h2>Uploads</h2>
  <ul id="uploads"></ul>

  <h2>Player</h2>
  <div id="player"></div>

  <script src="/static/player.js"></script>
</body>
</html>
